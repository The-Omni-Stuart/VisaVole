name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # "tools" was removed from the SDK repo; skip it, keep platform-tools.
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests, lint and build debug APK
        # Tests run hermetically against the committed visa_data.db — the
        # network updateVisaDb task is opt-in (./gradlew updateVisaDb).
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

      - name: Extract version name
        id: version
        run: |
          version_name=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "name=${version_name:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "VisaVole-${{ steps.version.outputs.name }}-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisaVole-${{ steps.version.outputs.name }}-debug
          path: VisaVole-*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: VisaVole ${{ steps.version.outputs.name }}
          prerelease: true
          draft: false
          generate_release_notes: true
          files: |
            VisaVole-*.apk
            VisaVole-*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Build signed AAB
    # Opt-in: set the repo VARIABLE RELEASE_ENABLED to "true" and add the
    # secrets RELEASE_KEYSTORE_BASE64 (base64 of the .jks) and
    # RELEASE_KEYSTORE_PASSWORD before it runs.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > visavole-release.jks
          printf 'storeFile=visavole-release.jks\nstorePassword=%s\nkeyAlias=visavole\nkeyPassword=%s\n' \
            "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
            "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" > keystore.properties

      - name: Build signed AAB
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Rename AAB
        run: |
          cp app/build/outputs/bundle/release/app-release.aab "VisaVole-${{ needs.build.outputs.name }}.aab"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisaVole-release-aab
          path: VisaVole-*.aab
          if-no-files-found: error

      - name: Attach AAB to the tag release
        uses: softprops/action-gh-release@v2
        with:
          files: VisaVole-*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
