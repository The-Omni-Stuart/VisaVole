name: Build APK

# Release publishing only — ci.yml owns branch and pull-request checks, and tag pushes match none of its triggers.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Only adb is needed here; the rest of the SDK is resolved by the Gradle build.
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests, lint and build debug APK
        # Tests stay hermetic against the committed visa_data.db; updateVisaDb is opt-in and off the build path.
        run: ./gradlew :app:test :app:lintDebug :app:assembleDebug --stacktrace

      - name: Extract version name
        id: version
        run: |
          version_name=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "name=${version_name:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "VisaVole-${{ steps.version.outputs.name }}-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisaVole-${{ steps.version.outputs.name }}-debug
          path: VisaVole-*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: VisaVole ${{ steps.version.outputs.name }}
          prerelease: true
          draft: false
          generate_release_notes: true
          files: |
            VisaVole-*.apk
            VisaVole-*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Build signed AAB
    # Opt-in: needs repo variable RELEASE_ENABLED=true plus the RELEASE_KEYSTORE_BASE64 and RELEASE_KEYSTORE_PASSWORD secrets.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > visavole-release.jks
          printf 'storeFile=visavole-release.jks\nstorePassword=%s\nkeyAlias=visavole\nkeyPassword=%s\n' \
            "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
            "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" > keystore.properties

      - name: Build signed AAB
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Rename AAB
        run: |
          cp app/build/outputs/bundle/release/app-release.aab "VisaVole-${{ needs.build.outputs.name }}.aab"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisaVole-release-aab
          path: VisaVole-*.aab
          if-no-files-found: error

      - name: Attach AAB to the tag release
        uses: softprops/action-gh-release@v2
        with:
          files: VisaVole-*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
