name: CI Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: JVM tests, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run all JVM unit tests, lint and build
        # assembleRelease keeps R8 full mode and resource shrinking compiling on every push;
        # without a keystore it produces an unsigned APK, which is all this job needs to check.
        run: ./gradlew :app:test :app:lintDebug :app:assembleDebug :app:assembleRelease --stacktrace

  emulator-tests:
    name: Android emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Emulator minutes only on the shared branches and on PRs, not every feature push.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'))

    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        id: emu1
        continue-on-error: true
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          script: |
            ./gradlew :app:connectedDebugAndroidTest --stacktrace || { adb logcat -d -v brief > /tmp/test-logcat.txt; exit 1; }

      # Runner emulator-boot flakes leave zero test results; retry only those. A real failure
      # wrote XML, so it is re-surfaced below instead of burning a second boot on it.
      - name: Run instrumented tests (emulator boot retry)
        if: steps.emu1.outcome == 'failure' && hashFiles('app/build/outputs/androidTest-results/connected/**/*.xml') == ''
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          script: |
            ./gradlew :app:connectedDebugAndroidTest --stacktrace || { adb logcat -d -v brief > /tmp/test-logcat.txt; exit 1; }

      - name: Surface the failed test run
        if: steps.emu1.outcome == 'failure' && hashFiles('app/build/outputs/androidTest-results/connected/**/*.xml') != ''
        run: exit 1

      - name: Dump connected test results on failure
        if: failure()
        run: |
          find app/build/outputs/androidTest-results/connected -name '*.xml' -exec cat {} + 2>/dev/null || true
          grep -E "AndroidRuntime|FATAL|ComposeUiTest|VisaVole" /tmp/test-logcat.txt | head -300 || true
